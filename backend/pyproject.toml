[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soar-lite-backend"
version = "0.1.0"
description = "SOAR Lite API and worker scaffold"
requires-python = ">=3.12"
dependencies = ["alembic>=1.14,<2", "fastapi>=0.115,<1", "httpx>=0.28,<1", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3", "uvicorn[standard]>=0.34,<1"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["app"]
