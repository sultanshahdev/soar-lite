name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: soar_lite_test
          POSTGRES_USER: soar_test
          POSTGRES_PASSWORD: soar_test_password
        options: >-
          --health-cmd "pg_isready -U soar_test -d soar_lite_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pytest pytest-asyncio httpx2
      - run: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://soar_test:soar_test_password@localhost:5432/soar_lite_test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run build
